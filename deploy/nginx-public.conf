# Install in nginx's http context. Replace hostname and certificate paths first.
server {
    listen 80;
    server_name demo.example.invalid;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name demo.example.invalid;
    ssl_certificate /etc/letsencrypt/live/demo.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/hauntcast/current/frontend/dist;
    index index.html;
    client_max_body_size 16k;
    client_body_timeout 15s;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-HauntCast-Live-Access "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 190s;
        proxy_send_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        add_header Cache-Control no-store;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
