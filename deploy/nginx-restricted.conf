# Optional private live host: NOT an anonymous public demo.
# Reserved documentation IP denies real visitors until an operator selects a trusted IP/VPN.
# Copy security headers and TLS policy from nginx-public.conf when installing this host.
server {
    listen 443 ssl;
    server_name live.example.invalid;
    ssl_certificate /etc/letsencrypt/live/live.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/live.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 192.0.2.10;
    deny all;
    access_log off;
    root /srv/hauntcast/current/frontend/dist;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Private file contains only: proxy_set_header X-HauntCast-Live-Access "RANDOM_TOKEN";
        # Must match restricted.env. Never put this value in frontend code or Git.
        include /etc/hauntcast/live-proxy-secret.conf;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 190s;
        proxy_send_timeout 30s;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8001; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
