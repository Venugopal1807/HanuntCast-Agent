# Keeps the free Render demo awake through judging (Render sleeps after ~15 idle minutes).
# Pings GET /healthz only: free, unauthenticated, no AssemblyAI call. Needs the repository
# variable RENDER_URL (Settings → Secrets and variables → Actions → Variables), e.g.
# https://blackthorn-house.onrender.com. After 15 Nov 2026 (UTC) the workflow disables itself.
name: Keep Render demo awake

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may start scheduled runs late; 10 min leaves margin under 15.
  workflow_dispatch:

permissions:
  actions: write             # Only used to disable this workflow after the end date.

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /healthz until 15 Nov 2026
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20261115 ]; then
            echo "Keep-awake window ended; disabling this workflow."
            gh workflow disable keep-awake.yml
            exit 0
          fi
          if [ -z "$RENDER_URL" ]; then
            echo "Repository variable RENDER_URL is not set yet; nothing to ping."
            exit 0
          fi
          # A sleeping free instance can take about a minute to start.
          curl -fsS --max-time 100 --retry 2 --retry-delay 15 "${RENDER_URL%/}/healthz"
          echo
